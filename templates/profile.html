{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h2>👤 My Profile</h2>
    <p style="color: gray; margin-bottom: 20px;">Manage your account information here.</p>

    <!-- Profile Info Card -->
    <div class="stat-card" style="border-top: 5px solid #3498db; text-align: left; padding: 30px;">
        <h3 style="color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Account Details</h3>
        
        <div style="margin-bottom: 15px;">
            <strong style="color: #777;">School Name:</strong><br>
            <span style="font-size: 18px; font-weight: bold;">🏫 {{ user.school_name }}</span>
        </div>
        
        <div style="margin-bottom: 15px;">
            <strong style="color: #777;">Email Address:</strong><br>
            <span style="font-size: 18px;">📧 {{ user.email }}</span>
        </div>
    </div>

    <!-- Change Password Card -->
    <div class="stat-card" style="border-top: 5px solid #e74c3c; text-align: left; padding: 30px; margin-top: 20px;">
        <h3 style="color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Change Password</h3>
        
        <form method="POST" action="/update_password">
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom: 5px; font-weight:bold; color: #777;">New Password</label>
                <input type="password" name="new_password" placeholder="Enter new password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
            </div>
            
            <button type="submit" style="background: #e74c3c; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
