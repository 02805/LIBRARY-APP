{% extends 'base.html' %}

{% block content %}
<h2>👨‍🏫 Teachers Management</h2>

<form method="POST" action="/add_teacher" class="add-form">
    <input type="text" name="name" placeholder="Teacher Name" required>
    <input type="text" name="department" placeholder="Department (e.g., Science)">
    <button type="submit">Add Teacher</button>
</form>

<!-- Search Form -->
<form method="GET" action="/teachers" class="add-form" style="background: #e8f4f8; margin-bottom: 10px;">
    <input type="text" name="search" placeholder="Search by name or department..." value="{{ search_query }}" style="flex: 1;">
    <button type="submit" style="background:#3498db;">Search</button>
    {% if search_query %}
        <a href="/teachers" style="padding: 10px; text-decoration: none; color: red; font-weight:bold;">Clear</a>
    {% endif %}
</form>

<table>
    <tr>
        <th>ID</th><th>Name</th><th>Department</th><th>Action</th>
    </tr>
    {% for t in teachers %}
    <tr>
        <td>{{ t.id }}</td>
        <td>{{ t.name }}</td>
        <td>{{ t.department }}</td>
        <td>
            <a href="/delete_teacher/{{ t.id }}" style="color:red; text-decoration:none; font-weight:bold;" onclick="return confirm('Are you sure you want to delete this teacher? They must have no borrowed books.');">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
