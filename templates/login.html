<!DOCTYPE html>
<html>
<head>
    <title>School Library - Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Loading Spinner CSS */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .login-box { display: none; } /* Hide login box until loaded */
    </style>
</head>
<body>

    <!-- The Loading Screen -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2>Waking up the Library...</h2>
        <p>This may take up to 30 seconds on the first visit.</p>
    </div>

    <!-- The Login Box -->
    <div class="login-box" id="login-box">
        <h2>📚 Library Login</h2>
        
        {% if error %}<p style="color:red; margin-bottom: 10px;">{{ error }}</p>{% endif %}
        {% if success %}<p style="color:green; margin-bottom: 10px;">{{ success }}</p>{% endif %}
        
        <form method="POST">
            <input type="text" name="email" placeholder="Email Address (or 'superadmin')" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        
        <p style="margin-top: 15px; font-size: 13px;">
            New school? <a href="/register" style="color: #8e44ad; font-weight: bold;">Register here</a>
        </p>
    </div>

    <script>
        // Hide loading screen after page finishes loading
        window.addEventListener("load", function() {
            setTimeout(function() {
                document.getElementById("loading-overlay").style.opacity = "0";
                setTimeout(function() {
                    document.getElementById("loading-overlay").style.display = "none";
                    document.getElementById("login-box").style.display = "block";
                }, 500); // Wait for fade out
            }, 1000); // Show spinner for at least 1 second even if super fast
        });
    </script>

</body>
</html>
