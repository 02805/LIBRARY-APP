{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>🎓 Classes Management</h2>
    <a href="/delete_all_students" style="background:#e74c3c; color:white; padding:10px 15px; text-decoration:none; border-radius:5px; font-weight:bold;" onclick="return confirm('⚠️ WARNING: Are you sure you want to DELETE ALL STUDENTS? This cannot be undone.');">🗑️ Delete All Students</a>
</div>

<div class="cards" style="display: flex; flex-wrap: wrap; gap: 20px;">
    {% for c in classes %}
    <a href="/students/{{ c.class_name }}" class="card" style="text-decoration: none; border-top: 5px solid #3498db; padding: 30px; width: 200px; text-align: center; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s;">
        <h3 style="color: #2c3e50; font-size: 24px; margin-bottom: 5px;">{{ c.class_name }}</h3>
        <p style="color: #3498db; font-weight: bold; font-size: 18px;">{{ c.count }} Students</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
