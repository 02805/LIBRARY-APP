{% extends 'base.html' %}

{% block content %}
<h2>🎓 Students Management</h2>

<form method="POST" action="/add_student" class="add-form">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="text" name="class_name" placeholder="Class (e.g., 10A)">
    <input type="text" name="roll_no" placeholder="Roll Number" required>
    <button type="submit">Add Student</button>
</form>

<!-- Search Form -->
<form method="GET" action="/students" class="add-form" style="background: #e8f4f8; margin-bottom: 10px;">
    <input type="text" name="search" placeholder="Search by name or roll number..." value="{{ search_query }}" style="flex: 1;">
    <button type="submit" style="background:#3498db;">Search</button>
    
    {% if search_query %}
        <a href="/students" style="padding: 10px; text-decoration: none; color: red; font-weight:bold;">Clear</a>
    {% endif %}
</form>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Class</th>
        <th>Roll No</th>
        <th>Action</th>
    </tr>
    {% for s in students %}
    <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.class_name }}</td>
        <td>{{ s.roll_no }}</td>
        <td>
            <a href="/delete_student/{{ s.id }}" style="color:red; text-decoration:none; font-weight:bold;" onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
