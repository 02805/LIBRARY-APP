{% extends 'base.html' %}

{% block content %}
<h2>✏️ Edit Student</h2>

<div class="add-form" style="display:block; max-width: 500px;">
    <form method="POST">
        <div style="margin-bottom: 10px;">
            <label>Full Name:</label><br>
            <input type="text" name="name" value="{{ student.name }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 10px;">
            <label>Class:</label><br>
            <input type="text" name="class_name" value="{{ student.class_name }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 10px;">
            <label>Roll Number:</label><br>
            <input type="text" name="roll_no" value="{{ student.roll_no }}" required style="width: 100%; padding: 8px;">
        </div>

        <button type="submit" style="background:#3498db; width: 100%;">Save Changes</button>
        <a href="/students/{{ student.class_name }}" style="display:block; text-align:center; margin-top:10px; color:red; text-decoration:none; font-weight:bold;">Cancel</a>
    </form>
</div>
{% endblock %}
