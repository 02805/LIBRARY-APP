 {% extends 'base.html' %}

{% block content %}
<h2>✏️ Edit Book</h2>

<div class="add-form" style="display:block; max-width: 500px;">
    <form method="POST">
        <div style="margin-bottom: 10px;">
            <label>Book Title:</label><br>
            <input type="text" name="title" value="{{ book.title }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 10px;">
            <label>Book Code (e.g., MA 01):</label><br>
            <input type="text" name="book_code" value="{{ book.book_code or '' }}" style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 10px;">
            <label>Author:</label><br>
            <input type="text" name="author" value="{{ book.author }}" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 10px;">
            <label>ISBN:</label><br>
            <input type="text" name="isbn" value="{{ book.isbn }}" style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 10px;">
            <label>Condition (e.g., New, Good, Damaged):</label><br>
            <input type="text" name="condition" value="{{ book.condition or 'Good' }}" style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Quantity:</label><br>
            <input type="number" name="quantity" value="{{ book.quantity }}" min="0" required style="width: 100%; padding: 8px;">
        </div>
        
        <button type="submit" style="background:#3498db; width: 100%;">Save Changes</button>
        <a href="/books" style="display:block; text-align:center; margin-top:10px; color:red; text-decoration:none; font-weight:bold;">Cancel</a>
    </form>
</div>
{% endblock %}
